<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контент-план</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F7;
    --surface:#FFFFFF;
    --surface-tint:#EFEEF3;
    --surface-tint-2:#E4E3E9;
    --ink:#16151A;
    --ink-soft:#75747E;
    --ink-faint:#9D9DA1;
    --border:#E4E3E9;
    --border-light:#EFEEF3;
    --accent:#FE4500;
    --accent-dark:#E63E00;
    --accent-soft:#FFF1EB;
    --success:#1BA743;
    --success-soft:#E6F6EB;
    --info:#337FFF;
    --info-soft:#F2F7FF;
    --radius-lg:20px;
    --radius-md:12px;
    --radius-sm:9px;
    --shadow-sm:0 1px 2px rgba(22,21,26,0.06);
    --shadow-md:0 10px 26px rgba(22,21,26,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 32px 80px;
    background:
      radial-gradient(circle at 92% -8%, rgba(254,69,0,.07), transparent 42%),
      radial-gradient(circle at -8% 42%, rgba(51,127,255,.05), transparent 38%),
      var(--bg);
  }
  h1,h2,h3{font-family:'Montserrat',sans-serif; margin:0;}

  /* ===== Header ===== */
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
  .brand{display:flex; flex-direction:column; gap:4px;}
  .brand h1{font-size:27px; font-weight:800; letter-spacing:-0.3px; color:var(--ink);}
  .brand h1 span{color:var(--accent);}
  .brand .sub{font-size:13px; color:var(--ink-faint);}
  .sync-status{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}

  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:var(--radius-md); padding:9px 15px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
  .btn.ghost{background:transparent; border-color:transparent; box-shadow:none; color:var(--ink-soft);}
  .btn.ghost:hover{background:var(--surface-tint); box-shadow:none;}
  .btn.light{background:var(--surface-tint); border-color:transparent; color:var(--ink); box-shadow:none;}
  .btn.light:hover{background:var(--surface-tint-2); box-shadow:none;}
  .btn.small{padding:6px 12px; font-size:12.5px;}
  .btn.danger{background:#fff; color:#C6362E; border-color:#F3C7C2;}
  .filter-badge{
    background:var(--accent); color:#fff; font-size:10.5px; font-weight:800;
    border-radius:999px; padding:1px 6px; line-height:1.5;
  }
  .chevron{display:inline-block; transition:transform .15s ease; font-size:11px;}
  .chevron.open{transform:rotate(180deg);}

  /* ===== Month nav ===== */
  .monthbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
  .monthbar .nav{display:flex; align-items:center; gap:10px;}
  .monthbar .month-label{font-family:'Montserrat',sans-serif; font-size:17px; font-weight:700; min-width:190px; text-align:center; color:var(--ink);}
  .nav-arrow{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
    background:var(--surface); cursor:pointer; display:flex;align-items:center;justify-content:center;
    font-size:15px; color:var(--ink); box-shadow:var(--shadow-sm);
  }
  .nav-arrow:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

  /* ===== Filters ===== */
  .filters-row{margin-bottom:12px;}
  .filters{
    display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start;
    background:var(--surface); border-radius:var(--radius-lg); border:1px solid var(--border-light);
    padding:14px 18px; margin-top:10px; margin-bottom:8px; box-shadow:var(--shadow-md);
  }
  .filter-group{display:flex; flex-direction:column; gap:6px;}
  .filter-group .label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; max-width:420px;}
  .chip{
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:var(--radius-sm); cursor:pointer;
    transition:transform .1s ease; user-select:none; white-space:nowrap;
  }
  .chip:hover{transform:translateY(-1px);}
  .filter-clear{align-self:flex-end; margin-left:auto;}

  /* ===== Calendar grid ===== */
  .weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:8px;}
  .weekdays div{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); text-align:left; padding-left:6px;}
  .weekdays div:nth-child(6), .weekdays div:nth-child(7){color:var(--accent);}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:10px;}
  .day-cell{
    background:var(--surface); color:var(--ink); border-radius:var(--radius-lg); border:1px solid var(--border-light);
    min-height:120px; padding:10px; display:flex; flex-direction:column; gap:7px;
    opacity:0; transform:translateY(6px); animation:riseIn .35s ease forwards;
  }
  .day-cell.weekend{background:#FBFAFB;}
  .day-cell.pad{opacity:.35; box-shadow:none;}
  .day-cell.pad .day-num{color:var(--ink-faint);}
  .day-cell.drag-over{box-shadow:0 0 0 2px var(--accent) inset; border-color:var(--accent);}
  .day-cell.today{border-color:var(--success); box-shadow:0 0 0 1px var(--success);}
  @keyframes riseIn{to{opacity:1; transform:translateY(0);}}
  .day-head{display:flex; align-items:center; justify-content:space-between;}
  .day-num{font-family:'Montserrat',sans-serif; font-size:15px; font-weight:700; color:var(--ink-soft);}
  .today .day-num{color:var(--success);}
  .add-post-btn{
    border:none; background:transparent; color:var(--ink-faint); cursor:pointer;
    font-size:16px; line-height:1; padding:2px 6px; border-radius:6px; opacity:0; transition:opacity .15s;
  }
  .day-cell:hover .add-post-btn{opacity:1;}
  .add-post-btn:hover{background:var(--accent-soft); color:var(--accent);}
  .cards{display:flex; flex-direction:column; gap:6px; flex:1;}

  /* ===== Post card ===== */
  .post-card{
    position:relative; background:#fff; border:1.5px solid var(--accent);
    border-radius:var(--radius-sm); padding:7px 9px 8px; cursor:grab;
    transition:box-shadow .12s ease, transform .12s ease, opacity .15s ease, filter .15s ease, background .12s ease, border-color .12s ease;
  }
  .post-card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .post-card.dragging{opacity:.4;}
  .post-card.status-done{background:var(--surface-tint); border-color:transparent; opacity:.55; filter:saturate(.6);}
  .post-card.status-done:hover{opacity:.8;}
  .post-flag{
    position:absolute; top:-7px; right:-7px; background:#fff; border:1px solid var(--border);
    border-radius:50%; width:20px;height:20px; display:flex;align-items:center;justify-content:center;
    font-size:11px; box-shadow:var(--shadow-sm);
  }
  .post-title{font-size:12.5px; font-weight:700; line-height:1.3; margin-bottom:5px; word-break:break-word;}
  .badge-row{display:flex; flex-wrap:wrap; gap:3px;}
  .badge-row + .badge-row{margin-top:3px;}
  .badge{font-size:9px; font-weight:700; padding:2px 5.5px; border-radius:5px; letter-spacing:.01em;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(22,21,26,0.42); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{display:flex;}
  #miniOverlay{z-index:70;}
  .modal{
    background:var(--surface); color:var(--ink); border-radius:var(--radius-lg); width:100%; max-width:680px;
    max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-md); padding:24px 24px 20px;
    position:relative; animation:popIn .18s ease;
  }
  @keyframes popIn{from{opacity:0; transform:scale(.97) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .modal h2{font-size:19px; font-weight:700; margin-bottom:16px; padding-right:34px; color:var(--ink);}
  .modal-close{
    position:absolute; top:18px; right:18px; width:30px; height:30px; border-radius:50%;
    border:none; background:var(--surface-tint); color:var(--ink-soft); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1; transition:.15s;
  }
  .modal-close:hover{background:var(--surface-tint-2); color:var(--ink);}
  .field{margin-bottom:15px;}
  .field label{display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text], .field input[type=url], .field input[type=date], .field textarea, .field select{
    width:100%; border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 13px;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:#fff;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .field textarea{resize:vertical; min-height:56px;}
  .pill-picker{display:flex; flex-wrap:wrap; gap:6px;}
  .pill{
    position:relative; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:var(--radius-sm); cursor:pointer;
    border:1px solid var(--border); background:var(--surface-tint); color:var(--ink-soft); transition:.12s;
  }
  .pill.selected{border-color:transparent;}
  .pill.has-x{padding-right:26px;}
  .pill.add-new{border-style:dashed; color:var(--ink-faint); font-weight:600; background:transparent;}
  .pill.add-new:hover{border-color:var(--accent); color:var(--accent);}
  .pill-x{
    position:absolute; right:5px; top:50%; transform:translateY(-50%);
    width:16px;height:16px;border-radius:50%; border:none; background:rgba(22,21,26,0.08);
    color:inherit; font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .pill-x:hover{background:#C6362E; color:#fff;}
  /* сегментированный переключатель статуса */
  #f_status{display:flex; gap:0; background:var(--surface-tint); border-radius:var(--radius-md); padding:4px; flex-wrap:nowrap;}
  #f_status .pill{flex:1; text-align:center; border:none; background:transparent; padding:8px 4px; border-radius:8px; font-size:12px;}
  #f_status .pill.selected{box-shadow:var(--shadow-sm);}

  /* ===== Отметка: кружки-смайлики в шапке модалки ===== */
  .modal-head{display:flex; align-items:center; gap:8px; margin-bottom:16px; padding-right:34px; flex-wrap:wrap;}
  .modal-head h2{margin-bottom:0;}
  .flag-circles{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap;}
  .flag-circ{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--border);
    background:var(--surface-tint); font-size:14px; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.12s; flex:none;
  }
  .flag-circ:hover{border-color:var(--accent);}
  .flag-circ.selected{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent-soft);}
  .flag-circ-add{border-style:dashed; color:var(--ink-faint); font-weight:700; font-size:15px;}
  .flag-circ-add:hover{color:var(--accent);}

  /* ===== Сворачиваемые поля (Формат / Комментарий) ===== */
  .acc-head{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .acc-label{font-size:13px; font-weight:500; color:var(--ink-soft);}
  .acc-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none;}
  .acc-head .chevron{margin-left:auto; color:var(--ink-faint);}
  .acc-body{margin-top:8px;}

  /* ===== Скрепка внутри комментария ===== */
  .comment-wrap{position:relative;}
  #f_comment{padding-right:42px;}
  .clip-btn{
    position:absolute; right:8px; bottom:8px; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--border); background:#fff; color:var(--ink-soft); font-size:13px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.12s;
  }
  .clip-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .clip-btn.has-img{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}

  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px;}
  .danger-link{color:#C6362E; font-size:12.5px; font-weight:700; background:none; border:none; cursor:pointer; padding:6px 4px;}
  .danger-link:hover{text-decoration:underline;}
  .text-link{color:var(--ink-soft); font-size:12.5px; font-weight:700; background:none; border:none; cursor:pointer; padding:6px 4px;}
  .text-link:hover{color:var(--accent); text-decoration:underline;}
  .hint{font-size:11px; color:var(--ink-faint); margin-top:4px;}

  /* ===== Чек-лист ===== */
  .cl-count{font-size:11px; font-weight:700; color:var(--ink-faint); background:var(--surface-tint); padding:2px 8px; border-radius:999px; margin-left:6px;}
  .cl-row{display:flex; align-items:flex-start; gap:8px; padding:5px 0;}
  .cl-circle{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border); background:#fff;
    cursor:pointer; flex:none; padding:0; position:relative; margin-top:1px; transition:.12s;
  }
  .cl-circle:hover{border-color:var(--accent);}
  .cl-circle.done{background:var(--success); border-color:var(--success);}
  .cl-circle.done::after{content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700;}
  .cl-text{flex:1; font-size:13.5px; line-height:1.4; word-break:break-word; white-space:pre-wrap; padding-top:1px; color:var(--ink);}
  .cl-text.done{color:var(--ink-faint); text-decoration:line-through;}
  .cl-del{opacity:0; border:none; background:transparent; color:var(--ink-faint); cursor:pointer; font-size:15px; flex:none; padding:0 2px; transition:.15s;}
  .cl-row:hover .cl-del{opacity:1;}
  .cl-del:hover{color:#C6362E;}
  .cl-add-row{
    display:flex; align-items:center; gap:8px; border:1.5px dashed var(--border); border-radius:var(--radius-sm);
    padding:8px 10px; margin-top:6px;
  }
  .cl-add-icon{color:var(--ink-faint); font-size:15px; flex:none;}
  .cl-add-row input{border:none; outline:none; flex:1; font-size:13.5px; font-family:'Inter',sans-serif; background:transparent; color:var(--ink);}
  .img-upload-label{cursor:pointer;}
  .backlog-row{
    border:1px solid var(--border-light); border-radius:var(--radius-sm); padding:10px 34px 10px 12px;
    cursor:pointer; background:var(--surface-tint); position:relative; transition:.12s;
  }
  .backlog-row:hover{background:#fff; box-shadow:var(--shadow-sm); border-color:var(--border);}
  .backlog-row .b-title{font-weight:700; font-size:13.5px;}
  .backlog-row .b-desc{font-size:12.5px; color:var(--ink-soft); margin-top:3px; white-space:pre-wrap;}

  /* ===== Loading ===== */
  .loading-wrap{display:flex; align-items:center; justify-content:center; height:50vh; flex-direction:column; gap:10px; color:var(--ink-soft);}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--accent-soft); border-top-color:var(--accent); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--ink); color:#fff; padding:9px 18px; border-radius:999px;
    font-size:12.5px; font-weight:600; box-shadow:var(--shadow-md); z-index:90; transition:all .25s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:880px){
    body{padding:18px 14px 60px;}
    .grid, .weekdays{grid-template-columns:repeat(7,minmax(90px,1fr)); overflow-x:auto;}
    .filters{gap:12px;}
  }

  /* ===== Экран входа ===== */
  #gateScreen{
    position:fixed; inset:0; z-index:200; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  #gateScreen.hidden{display:none;}
  .gate-box{background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:28px; width:280px; text-align:center;}
  .gate-box h2{font-size:18px; margin-bottom:14px;}
  .gate-box input{width:100%; border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 13px; font-size:14px; margin-bottom:6px; box-sizing:border-box;}
  .gate-box .err{color:#C6362E; font-size:12.5px; min-height:16px; margin-bottom:8px;}
</style>
</head>
<body>

<div id="gateScreen">
  <div class="gate-box">
    <h2>Контент-план</h2>
    <input type="password" id="gatePw" placeholder="Пароль">
    <div class="err" id="gateErr"></div>
    <button class="btn primary" id="gateGo" style="width:100%; justify-content:center;">Войти</button>
  </div>
</div>

<!-- Firebase SDK (compat) — здесь будет храниться общий контент-план -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-auth-compat.min.js"></script>
<script>
  // ЗАМЕНИ на конфиг своего проекта из Firebase Console → Project settings → Your apps
  const firebaseConfig = {
    apiKey: "AIzaSyAelzW8K-8uOhXbGl9ZYMeOpsC8yk2B_w0",
    authDomain: "content-plan-ul.firebaseapp.com",
    databaseURL: "https://content-plan-ul-default-rtdb.firebaseio.com",
    projectId: "content-plan-ul",
    storageBucket: "content-plan-ul.firebasestorage.app",
    messagingSenderId: "298274358202",
    appId: "1:298274358202:web:5499fd44a7e487d06a9383"
  };
  // Пароль для входа в календарь — смени на свой перед публикацией
  const APP_PASSWORD = "UL_CP_2026";

  firebase.initializeApp(firebaseConfig);
  const fbdb = firebase.database();

  function encodeStorageKey(k){ return String(k).replace(/[.#$\[\]\/]/g, '_'); }

  // Замена window.storage из Claude-артефактов на Firebase Realtime Database.
  // Контракт тот же: get бросает ошибку, если ключа нет (как и было раньше).
  window.storage = {
    async get(key, shared){
      const snap = await fbdb.ref('kp/'+encodeStorageKey(key)).get();
      if(!snap.exists()) throw new Error('not found');
      return { key, value: snap.val(), shared: !!shared };
    },
    async set(key, value, shared){
      await fbdb.ref('kp/'+encodeStorageKey(key)).set(value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      await fbdb.ref('kp/'+encodeStorageKey(key)).remove();
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      return { keys: [], prefix: prefix||'', shared: !!shared };
    }
  };

  // Гейт по паролю + анонимная авторизация Firebase (нужна для правил доступа к базе)
  (function(){
    const gate = document.getElementById('gateScreen');
    const pwInput = document.getElementById('gatePw');
    const errEl = document.getElementById('gateErr');
    const goBtn = document.getElementById('gateGo');

    async function unlock(){
      const val = pwInput.value;
      if(val !== APP_PASSWORD){ errEl.textContent = 'Неверный пароль'; return; }
      errEl.textContent = '';
      try{
        await firebase.auth().signInAnonymously();
      }catch(e){
        errEl.textContent = 'Не получилось подключиться, проверь интернет и попробуй ещё раз';
        return;
      }
      sessionStorage.setItem('kp_unlocked', '1');
      gate.classList.add('hidden');
      window.__kpUnlockedAlready = true; window.dispatchEvent(new Event('kp-unlocked'));
    }
    goBtn.onclick = unlock;
    pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });

    if(sessionStorage.getItem('kp_unlocked') === '1'){
      firebase.auth().signInAnonymously().then(()=>{
        gate.classList.add('hidden');
        window.__kpUnlockedAlready = true; window.dispatchEvent(new Event('kp-unlocked'));
      }).catch(()=>{ sessionStorage.removeItem('kp_unlocked'); });
    }
  })();
</script>

<div id="app">
  <div class="loading-wrap" id="loadingWrap">
    <div class="spinner"></div>
    <div>Загружаем контент-план…</div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="overlay" id="miniOverlay"><div class="modal" id="miniModalBody" style="max-width:340px;"></div></div>

<div class="toast" id="toast"></div>

<button id="backlogBtn" class="btn primary" style="position:fixed; bottom:24px; right:24px; z-index:40;">📋 Backlog</button>

<script>
/* =========================================================
   ДАННЫЕ И СОСТОЯНИЕ
   ========================================================= */
const STORAGE_KEY = 'content-plan-v1';
const SCHEMA_VERSION = 7;

const DEFAULT_DATA = {
  schemaVersion: SCHEMA_VERSION,
  posts: [],
  platformTags: [
    {id:'tg',   label:'ТГ',     bg:'#DDE7FF', fg:'#2A50B8'},
    {id:'vk',   label:'ВК',     bg:'#FFE8DC', fg:'#B25A1E'},
    {id:'inst', label:'ИНСТ',   bg:'#FFE1E1', fg:'#C42F36'},
    {id:'max',  label:'МАХ',    bg:'#DFF3E5', fg:'#0E7A34'},
    {id:'blog', label:'Блог',   bg:'#EDE4FB', fg:'#6B3FA0'},
    {id:'dzen', label:'Дзен',   bg:'#FFE2D3', fg:'#C24500'},
    {id:'youtube', label:'Ютуб', bg:'#FFD9CC', fg:'#B23100'},
    {id:'other',   label:'Другое', bg:'#FDE8F3', fg:'#A83D74'}
  ],
  formatTags: [
    {id:'text',  label:'Текст',        icon:'📝'},
    {id:'video', label:'Видео',        icon:'🎬'},
    {id:'carousel', label:'Карусель',  icon:'🖼️'},
    {id:'story', label:'Сторис',       icon:'📱'},
    {id:'infog', label:'Инфографика',  icon:'📊'}
  ],
  typeTags: [
    {id:'soc',     label:'Публикация СС',   color:'#E0894F'},
    {id:'blogpub', label:'Публикация блог', color:'#1BA743'},
    {id:'mail',    label:'Рассылка',        color:'#D1596F'},
    {id:'event2',  label:'Ивент',           color:'#8F6FD1'}
  ],
  responsibles: [],
  backlog: [],
  flagOptions: ['❓','🔥','⭐','⚠️']
};

const STATUS_LIST = [
  {id:'not_started', label:'Не начинал',  color:'#9D9DA1'},
  {id:'draft',        label:'Черновик',    color:'#75747E'},
  {id:'progress',     label:'В процессе',  color:'#E0894F'},
  {id:'done',         label:'Готово',      color:'#1BA743'}
];
const DEFAULT_STATUS = 'not_started';
const MAX_IMAGE_CHARS = 4700000;

const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth();
let filters = { platforms: new Set(), formats: new Set(), types: new Set(), statuses: new Set(), responsibles: new Set() };
let filtersOpen = false;
let draggingId = null;
let editingId = null;
let pendingImageData = undefined;
let pendingImageRemoved = false;

/* =========================================================
   ХРАНИЛИЩЕ
   ========================================================= */
async function loadData(showToast){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      data = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
      data.schemaVersion = parsed.schemaVersion || 0;
      ['platformTags','formatTags','typeTags','responsibles','posts','backlog','flagOptions'].forEach(k=>{
        if(!Array.isArray(data[k])) data[k] = DEFAULT_DATA[k];
      });
    }
  }catch(e){ /* ключа ещё нет — работаем с данными по умолчанию */ }

  migrateIfNeeded();
  if(showToast) showToastMsg('Обновлено');
}

function migrateIfNeeded(){
  const v = data.schemaVersion || 0;
  if(v >= SCHEMA_VERSION) return;

  if(v < 2){
    const removedPlatforms = ['event','post','cargo'];
    data.platformTags = data.platformTags.filter(t=>!removedPlatforms.includes(t.id));
    ['youtube','other'].forEach(id=>{
      if(!data.platformTags.find(t=>t.id===id)){
        const def = DEFAULT_DATA.platformTags.find(t=>t.id===id);
        if(def) data.platformTags.push(def);
      }
    });
    data.posts.forEach(p=>{
      if(p.platforms) p.platforms = p.platforms.filter(id=>!removedPlatforms.includes(id));
      if(p.typeTag && !p.types){ p.types = [p.typeTag]; }
      if(p.format && !p.formats){ p.formats = [p.format]; }
      delete p.typeTag; delete p.format;
      if(!Array.isArray(p.types)) p.types = [];
      if(!Array.isArray(p.formats)) p.formats = [];
      if(!p.status) p.status = DEFAULT_STATUS;
      if(typeof p.about !== 'string') p.about = '';
      if(typeof p.flag !== 'string') p.flag = '';
      if(typeof p.hasImage !== 'boolean') p.hasImage = false;
    });
  }

  if(v < 3){
    data.typeTags.forEach(t=>{
      const def = DEFAULT_DATA.typeTags.find(d=>d.id===t.id);
      if(def){ t.color = def.color; }
    });
  }

  if(v < 4){
    // обновляем стандартные площадки на новую (более светлую) палитру бейджей
    data.platformTags.forEach(t=>{
      const def = DEFAULT_DATA.platformTags.find(d=>d.id===t.id);
      if(def){ t.bg = def.bg; t.fg = def.fg; }
    });
  }

  if(v < 5){
    // Блог и Другое были серыми, как невыбранный фильтр — даём им свой цвет
    data.platformTags.forEach(t=>{
      const def = DEFAULT_DATA.platformTags.find(d=>d.id===t.id);
      if(def){ t.bg = def.bg; t.fg = def.fg; }
    });
  }

  if(v < 6){
    // убираем тег «Вебинар» — он больше не нужен
    data.typeTags = data.typeTags.filter(t=>t.id!=='webinar');
    data.posts.forEach(p=>{ if(p.types) p.types = p.types.filter(x=>x!=='webinar'); });
    filters.types.delete('webinar');
  }

  if(v < 7){
    // тег со случайно выпавшим серым цветом сливался с невыбранным фильтром — перекрашиваем
    const safePalette = ['#E0894F','#1BA743','#D1596F','#8F6FD1','#337FFF'];
    let paletteIdx = 0;
    data.typeTags.forEach(t=>{
      if(t.color === '#75747E'){
        t.color = safePalette[paletteIdx % safePalette.length];
        paletteIdx++;
      }
    });
    data.posts.forEach(p=>{ if(!Array.isArray(p.checklist)) p.checklist = []; });
  }

  data.schemaVersion = SCHEMA_VERSION;
  saveData();
}

async function saveData(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(data), true);
  }catch(e){
    showToastMsg('Не удалось сохранить :(');
  }
}

function showToastMsg(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToastMsg._t);
  showToastMsg._t = setTimeout(()=>t.classList.remove('show'), 1700);
}

/* =========================================================
   ПОМОЩНИКИ
   ========================================================= */
function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function isoDate(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayISO(){ const t=new Date(); return isoDate(t.getFullYear(), t.getMonth(), t.getDate()); }
function hashHue(str){ let h=0; for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); } return Math.abs(h)%360; }
function avatarColor(name){ return `hsl(${hashHue(name)}, 55%, 42%)`; }
function tagById(list, id){ return list.find(t=>t.id===id); }
function hexToSoft(hex){ return hex + '26'; }
function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }
function totalActiveFilters(){
  return filters.platforms.size + filters.formats.size + filters.types.size + filters.statuses.size + filters.responsibles.size;
}

/* =========================================================
   МИНИ-ОКНА
   ========================================================= */
function openMiniOverlay(html, width){
  const mb = document.getElementById('miniModalBody');
  mb.style.maxWidth = (width||340)+'px';
  mb.innerHTML = html;
  document.getElementById('miniOverlay').classList.add('show');
}
function closeMiniOverlay(){ document.getElementById('miniOverlay').classList.remove('show'); }

function showMiniPrompt(titleText, placeholderText, onSubmit){
  openMiniOverlay(`
    <h2 style="font-size:15px;">${escapeHtml(titleText)}</h2>
    <div class="field"><input type="text" id="miniInput" placeholder="${escapeAttr(placeholderText)}"></div>
    <div class="modal-actions" style="justify-content:flex-end;">
      <button class="btn light small" id="miniCancel">Отмена</button>
      <button class="btn primary small" id="miniOk">Добавить</button>
    </div>`);
  const input = document.getElementById('miniInput');
  setTimeout(()=>input.focus(), 30);
  const submit = ()=>{
    const val = input.value.trim();
    if(!val){ input.focus(); return; }
    closeMiniOverlay();
    onSubmit(val);
  };
  document.getElementById('miniOk').onclick = submit;
  document.getElementById('miniCancel').onclick = closeMiniOverlay;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

function showMiniConfirm(messageText, onConfirm){
  openMiniOverlay(`
    <h2 style="font-size:15px;">Удалить?</h2>
    <p style="font-size:13px; color:var(--ink-soft); margin:0 0 16px;">${escapeHtml(messageText)}</p>
    <div class="modal-actions" style="justify-content:flex-end;">
      <button class="btn light small" id="miniCancel">Отмена</button>
      <button class="btn small danger" id="miniOk">Удалить</button>
    </div>`);
  document.getElementById('miniOk').onclick = ()=>{ closeMiniOverlay(); onConfirm(); };
  document.getElementById('miniCancel').onclick = closeMiniOverlay;
}

/* =========================================================
   КАЛЕНДАРЬ: СЕТКА
   ========================================================= */
function buildMonthMatrix(year, month){
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    const m = month===0?11:month-1, y = month===0?year-1:year;
    cells.push({date:isoDate(y,m,d), day:d, pad:true});
  }
  for(let d=1; d<=daysInMonth; d++) cells.push({date:isoDate(year,month,d), day:d, pad:false});
  while(cells.length % 7 !== 0){
    const idx = cells.length - (startOffset+daysInMonth);
    const d = idx+1;
    const m = month===11?0:month+1, y = month===11?year+1:year;
    cells.push({date:isoDate(y,m,d), day:d, pad:true});
  }
  return cells;
}

/* =========================================================
   ФИЛЬТРАЦИЯ
   ========================================================= */
function postMatchesFilters(post){
  if(filters.platforms.size && !(post.platforms||[]).some(p=>filters.platforms.has(p))) return false;
  if(filters.formats.size && !(post.formats||[]).some(f=>filters.formats.has(f))) return false;
  if(filters.types.size && !(post.types||[]).some(t=>filters.types.has(t))) return false;
  if(filters.statuses.size && !filters.statuses.has(post.status)) return false;
  if(filters.responsibles.size && !filters.responsibles.has(post.responsible)) return false;
  return true;
}
function anyFilterActive(){ return totalActiveFilters() > 0; }

/* =========================================================
   РЕНДЕР: КАРКАС
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  const activeCount = totalActiveFilters();
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <h1>Контент<span>·</span>план</h1>
        <div class="sub">общий календарь — правки видны после обновления</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="sync-status"><span class="sync-dot"></span><span id="syncLabel">синхронизировано</span></div>
        <button class="btn" id="backupBtn">💾 Бэкап</button>
        <button class="btn" id="refreshBtn">⟳ Обновить</button>
      </div>
    </div>

    <div class="monthbar">
      <div class="nav">
        <button class="nav-arrow" id="prevMonth">‹</button>
        <div class="month-label">${MONTHS[viewMonth]} ${viewYear}</div>
        <button class="nav-arrow" id="nextMonth">›</button>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn small" id="filtersToggle">
          Фильтры ${activeCount ? `<span class="filter-badge">${activeCount}</span>` : ''}
          <span class="chevron${filtersOpen?' open':''}">⌄</span>
        </button>
        <button class="btn ghost small" id="todayBtn">Сегодня</button>
      </div>
    </div>

    <div class="filters-row">${filtersOpen ? renderFilters() : ''}</div>

    <div class="weekdays">${WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="grid" id="grid"></div>
  `;

  document.getElementById('prevMonth').onclick = ()=> shiftMonth(-1);
  document.getElementById('nextMonth').onclick = ()=> shiftMonth(1);
  document.getElementById('todayBtn').onclick = ()=>{ const t=new Date(); viewYear=t.getFullYear(); viewMonth=t.getMonth(); render(); };
  document.getElementById('filtersToggle').onclick = ()=>{ filtersOpen = !filtersOpen; render(); };
  document.getElementById('backupBtn').onclick = openBackupModal;
  document.getElementById('refreshBtn').onclick = async ()=>{
    document.getElementById('syncLabel').textContent = 'обновляем…';
    await loadData(true);
    render();
  };

  wireFilterEvents();
  renderGrid();
  updateBacklogBadge();
}

function shiftMonth(delta){
  viewMonth += delta;
  if(viewMonth<0){ viewMonth=11; viewYear--; }
  if(viewMonth>11){ viewMonth=0; viewYear++; }
  render();
}

/* =========================================================
   РЕНДЕР: ФИЛЬТРЫ
   ========================================================= */
function renderFilters(){
  const platformChips = data.platformTags.map(t=>chipHtml('platforms', t.id, t.label, t.fg, t.bg)).join('');
  const typeChips = data.typeTags.map(t=>chipHtml('types', t.id, t.label, t.color, hexToSoft(t.color))).join('');
  const respChips = data.responsibles.map(name=>chipHtml('responsibles', name, name, avatarColor(name), '#EFEEF3')).join('');

  return `
  <div class="filters">
    <div class="filter-group"><div class="label">Площадка</div><div class="chip-row">${platformChips}</div></div>
    <div class="filter-group"><div class="label">Тег</div><div class="chip-row">${typeChips}</div></div>
    ${data.responsibles.length ? `<div class="filter-group"><div class="label">Ответственный</div><div class="chip-row">${respChips}</div></div>` : ''}
    ${anyFilterActive() ? `<button class="btn small ghost filter-clear" id="clearFilters">Сбросить фильтры</button>` : ''}
  </div>`;
}
function chipHtml(group, id, label, fg, bg){
  const active = filters[group].has(id);
  const bgv = active ? bg : 'var(--surface-tint)';
  const fgv = active ? fg : 'var(--ink-soft)';
  return `<span class="chip" data-group="${group}" data-id="${escapeAttr(id)}" style="color:${fgv}; background:${bgv};">${escapeHtml(label)}</span>`;
}
function wireFilterEvents(){
  document.querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{
      const group = el.dataset.group, id = el.dataset.id;
      if(filters[group].has(id)) filters[group].delete(id); else filters[group].add(id);
      render();
    };
  });
  const clearBtn = document.getElementById('clearFilters');
  if(clearBtn) clearBtn.onclick = ()=>{ Object.keys(filters).forEach(k=>filters[k].clear()); render(); };
}

/* =========================================================
   РЕНДЕР: СЕТКА ДНЕЙ
   ========================================================= */
function renderGrid(){
  const grid = document.getElementById('grid');
  const cells = buildMonthMatrix(viewYear, viewMonth);
  const today = todayISO();
  const filtering = anyFilterActive();
  grid.innerHTML = '';

  cells.forEach((cell, i)=>{
    const dow = i % 7;
    const isWeekend = dow===5 || dow===6;
    const div = document.createElement('div');
    div.className = 'day-cell' + (isWeekend?' weekend':'') + (cell.pad?' pad':'') + (cell.date===today?' today':'');
    div.dataset.date = cell.date;
    div.style.animationDelay = (i*10) + 'ms';

    let dayPosts = data.posts.filter(p=>p.date===cell.date).sort((a,b)=>(a.order||0)-(b.order||0));
    if(filtering) dayPosts = dayPosts.filter(postMatchesFilters);

    div.innerHTML = `
      <div class="day-head">
        <span class="day-num">${cell.day}</span>
        <button class="add-post-btn" title="Добавить пост">＋</button>
      </div>
      <div class="cards"></div>
    `;
    const cardsWrap = div.querySelector('.cards');
    dayPosts.forEach(p=>cardsWrap.appendChild(renderCard(p)));
    div.querySelector('.add-post-btn').onclick = (e)=>{ e.stopPropagation(); openModal(null, cell.date); };

    div.addEventListener('dragover', (e)=>{ e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', ()=> div.classList.remove('drag-over'));
    div.addEventListener('drop', (e)=>{
      e.preventDefault();
      div.classList.remove('drag-over');
      if(!draggingId) return;
      const post = data.posts.find(p=>p.id===draggingId);
      if(!post) return;

      const cardEls = [...cardsWrap.querySelectorAll('.post-card')];
      let insertBeforeIndex = cardEls.length;
      for(let idx=0; idx<cardEls.length; idx++){
        const r = cardEls[idx].getBoundingClientRect();
        if(e.clientY < r.top + r.height/2){ insertBeforeIndex = idx; break; }
      }
      const targetDayPosts = data.posts.filter(p=>p.date===cell.date && p.id!==post.id).sort((a,b)=>(a.order||0)-(b.order||0));
      targetDayPosts.splice(insertBeforeIndex, 0, post);
      post.date = cell.date;
      targetDayPosts.forEach((p,idx)=>{ p.order = idx; });

      saveData();
      render();
    });

    grid.appendChild(div);
  });
}

function borderColorForPost(post){
  const types = post.types || [];
  const labels = types.map(tid=>{ const t = tagById(data.typeTags, tid); return (t?t.label:'').toLowerCase(); });
  const has = (needle)=> labels.some(l=>l.includes(needle));
  if(has('ивент')) return 'var(--info)';
  if(has('рассылк')) return 'var(--success)';
  if(has('seo') || has('сео') || has('онпейдж') || has('on-page') || has('onpage')) return 'var(--ink-faint)';
  return 'var(--accent)';
}

function renderCard(post){
  const el = document.createElement('div');
  el.className = 'post-card' + (post.status==='done' ? ' status-done' : '');
  el.draggable = true;
  el.dataset.id = post.id;
  if(post.status !== 'done'){
    el.style.borderColor = borderColorForPost(post);
  }

  const platformBadges = (post.platforms||[]).map(pid=>{
    const t = tagById(data.platformTags, pid);
    return t ? `<span class="badge" style="background:${t.bg}; color:${t.fg};">${escapeHtml(t.label)}</span>` : '';
  }).join('');
  const typeBadges = (post.types||[]).map(tid=>{
    const t = tagById(data.typeTags, tid);
    return t ? `<span class="badge" style="background:${hexToSoft(t.color)}; color:${t.color};">${escapeHtml(t.label)}</span>` : '';
  }).join('');

  el.innerHTML = `
    ${post.flag ? `<span class="post-flag">${escapeHtml(post.flag)}</span>` : ''}
    <div class="post-title">${escapeHtml(post.title || 'Без названия')}</div>
    <div class="badge-row">${typeBadges}</div>
    <div class="badge-row">${platformBadges}</div>
  `;

  el.addEventListener('click', ()=> openModal(post.id, post.date));
  el.addEventListener('dragstart', ()=>{ draggingId = post.id; el.classList.add('dragging'); });
  el.addEventListener('dragend', ()=>{ draggingId = null; el.classList.remove('dragging'); });

  return el;
}

/* =========================================================
   МОДАЛКА ПОСТА
   ========================================================= */
function openModal(postId, date){
  editingId = postId;
  pendingImageData = undefined;
  pendingImageRemoved = false;

  const post = postId ? data.posts.find(p=>p.id===postId) : {
    id: uid(), date, title:'', about:'', platforms:[], formats:[], types:[],
    status: DEFAULT_STATUS, flag:'', responsible:'', link:'', comment:'', hasImage:false, checklist:[],
    order: data.posts.filter(p=>p.date===date).length
  };

  renderModal(post, !postId);
  restoreImagePreviewIfAny(post);
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  editingId = null;
  render();
}

function renderModal(post, isNew, forceOpen){
  const body = document.getElementById('modalBody');
  const currentFlag = post.flag || '';
  const formatHasContent = (post.formats||[]).length>0;
  const formatOpen = forceOpen==='format' || formatHasContent;
  const commentHasContent = !!(post.comment && post.comment.trim()) || post.hasImage || !!pendingImageData;
  const commentOpen = forceOpen==='comment' || commentHasContent;

  body.innerHTML = `
    <button type="button" class="modal-close" id="modalCloseBtn" title="Закрыть">×</button>
    <div class="modal-head">
      <h2>${isNew ? 'Новый пост' : 'Редактирование поста'}</h2>
      <div class="flag-circles">
        ${data.flagOptions.map(e=>`<button type="button" class="flag-circ${currentFlag===e?' selected':''}" data-emoji="${escapeAttr(e)}">${escapeHtml(e)}</button>`).join('')}
        <button type="button" class="flag-circ flag-circ-add" id="f_flag_add" title="Свой смайлик">+</button>
      </div>
    </div>

    <div class="field"><label>Заголовок</label>
      <input type="text" id="f_title" value="${escapeAttr(post.title)}" placeholder="Например: Кейс №6">
    </div>

    <div class="field"><label>О чём</label>
      <textarea id="f_about" maxlength="160" placeholder="Коротко о содержании публикации" style="min-height:44px;">${escapeHtml(post.about||'')}</textarea>
    </div>

    <div class="field"><label>Дата</label>
      <input type="date" id="f_date" value="${post.date}">
    </div>

    <div class="field"><label>Статус</label>
      <div class="pill-picker" id="f_status">

        <div class="pill-picker" id="f_format">
          ${data.formatTags.map(t=>pillHtml('format', t.id, `${t.icon} ${t.label}`, (post.formats||[]).includes(t.id), '#F3DDE9', '#7A5568', true)).join('')}

        <span class="chevron${commentOpen?' open':''}">⌄</span>
      </div>
      <div class="acc-body" id="f_comment_acc_body" style="${commentOpen?'':'display:none;'}">
        <div class="comment-wrap">
          <textarea id="f_comment" placeholder="Любые детали по посту...">${escapeHtml(post.comment||'')}</textarea>
          <button type="button" class="clip-btn${post.hasImage?' has-img':''}" id="clipBtn" title="Прикрепить изображение">📎</button>
        </div>
        <input type="file" id="f_image" accept="image/*" style="display:none;">
        <div class="hint">до ~3 МБ</div>
        <div id="imgPreviewWrap"></div>
      </div>
    </div>

    <div class="field"><label>Ответственный</label>
      <input type="text" id="f_resp" list="respList" value="${escapeAttr(post.responsible||'')}" placeholder="Имя">
      <datalist id="respList">${data.responsibles.map(n=>`<option value="${escapeAttr(n)}">`).join('')}</datalist>
    </div>

    <div class="field"><label>Ссылка на драфт</label>
      <input type="url" id="f_link" value="${escapeAttr(post.link||'')}" placeholder="https://...">
    </div>

    <div class="modal-actions">
      <div>${isNew ? '' : '<button class="text-link" id="duplicateBtn">Дублировать</button><button class="danger-link" id="deleteBtn">Удалить пост</button>'}</div>
      <div style="display:flex; gap:8px;">
        <button class="btn light small" id="cancelBtn">Отмена</button>
        <button class="btn primary small" id="saveBtn">Сохранить</button>
      </div>
    </div>
  `;

  document.getElementById('modalCloseBtn').onclick = closeModal;
  setupPillGroup('f_status', false);
  setupPillGroup('f_platforms', true);
  setupPillGroup('f_format', true);
  setupPillGroup('f_type', true);

  body.querySelectorAll('.flag-circ:not(.flag-circ-add)').forEach(btn=>{
    btn.onclick = ()=>{
      const was = btn.classList.contains('selected');
      body.querySelectorAll('.flag-circ:not(.flag-circ-add)').forEach(b=>b.classList.remove('selected'));
      if(!was) btn.classList.add('selected');
    };
  });
  const addFlagBtn = document.getElementById('f_flag_add');
  if(addFlagBtn) addFlagBtn.onclick = ()=>{
    showMiniPrompt('Свой смайлик', 'Например: 🚀', (val)=>{
      const emoji = val.trim().slice(0,4);
      if(!emoji) return;
      if(!data.flagOptions.includes(emoji)) data.flagOptions.push(emoji);
      saveData();
      const updated = collectFormIntoPost(post);
      updated.flag = emoji;
      renderModal(updated, editingId===null);
      restoreImagePreviewIfAny(updated);
    });
  };

  body.querySelectorAll('.acc-head').forEach(h=>{
    h.onclick = ()=>{
      const bId = h.dataset.acc;
      const bodyEl = document.getElementById(bId+'_body');
      const chev = h.querySelector('.chevron');
      const isOpen = bodyEl.style.display !== 'none';
      bodyEl.style.display = isOpen ? 'none' : '';
      if(chev) chev.classList.toggle('open', !isOpen);
    };
  });

  body.querySelectorAll('[data-add]').forEach(el=>{
    el.onclick = ()=> promptAddTag(el.dataset.add, post);
  });
  body.querySelectorAll('.pill-x').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const kind = btn.dataset.delKind, id = btn.dataset.delId;
      const list = kind==='format' ? data.formatTags : data.typeTags;
      const tagObj = list.find(t=>t.id===id);
      showMiniConfirm(`Тег «${tagObj?tagObj.label:''}» будет удалён и снят со всех публикаций.`, ()=>{
        deleteTag(kind, id, collectFormIntoPost(post));
      });
    };
  });

  body.querySelectorAll('[data-cl-toggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.clToggle;
      const updated = collectFormIntoPost(post);
      const item = (updated.checklist||[]).find(i=>i.id===id);
      if(item) item.done = !item.done;
      renderModal(updated, editingId===null);
      restoreImagePreviewIfAny(updated);
    };
  });
  body.querySelectorAll('[data-cl-del]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.clDel;
      const updated = collectFormIntoPost(post);
      updated.checklist = (updated.checklist||[]).filter(i=>i.id!==id);
      renderModal(updated, editingId===null);
      restoreImagePreviewIfAny(updated);
    };
  });
  const clNewInput = document.getElementById('f_cl_new');
  if(clNewInput){
    clNewInput.addEventListener('keydown', (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const text = clNewInput.value.trim();
      if(!text) return;
      const updated = collectFormIntoPost(post);
      if(!Array.isArray(updated.checklist)) updated.checklist = [];
      updated.checklist.push({ id: uid(), text, done:false });
      renderModal(updated, editingId===null);
      restoreImagePreviewIfAny(updated);
      setTimeout(()=>{ const ni = document.getElementById('f_cl_new'); if(ni) ni.focus(); }, 20);
    });
  }

  const clipBtn = document.getElementById('clipBtn');
  const fileInput = document.getElementById('f_image');
  if(clipBtn) clipBtn.onclick = ()=> fileInput.click();
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      if(reader.result.length > MAX_IMAGE_CHARS){
        showToastMsg('Файл слишком большой, выбери поменьше (до ~3 МБ)');
        fileInput.value = '';
        return;
      }
      pendingImageData = reader.result;
      pendingImageRemoved = false;
      renderImagePreview(pendingImageData);
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('saveBtn').onclick = ()=> savePostFromForm(post, isNew);

      data.posts = data.posts.filter(p=>p.id!==post.id);
      saveData(); closeModal();
      showToastMsg('Пост удалён');
    });
  };
}

async function duplicatePost(post){
  const current = collectFormIntoPost(post);
  const dup = Object.assign({}, current);
  dup.id = uid();
  dup.title = (current.title || 'Без названия') + ' (копия)';
  dup.order = data.posts.filter(p=>p.date===current.date).length;
  dup.hasImage = false;
  dup.checklist = (current.checklist||[]).map(i=>({ id: uid(), text: i.text, done: i.done }));
  data.posts.push(dup);

  const savedPendingImage = pendingImageData;
  try{
    let imgData = savedPendingImage;
    if(!imgData && current.hasImage){
      const res = await window.storage.get('img:'+post.id, true);
      imgData = res && res.value;
    }
    if(imgData){
      await window.storage.set('img:'+dup.id, imgData, true);
      dup.hasImage = true;
    }
  }catch(e){ /* не получилось скопировать картинку — не критично */ }

  await saveData();
  showToastMsg('Пост продублирован');
  editingId = dup.id;
  pendingImageData = undefined;
  pendingImageRemoved = false;
  renderModal(dup, false);
  restoreImagePreviewIfAny(dup);
}

function renderChecklistField(post){
  const items = post.checklist || [];
  const doneCount = items.filter(i=>i.done).length;
  return `
    <div class="field">
      <label>Чек-лист${items.length ? `<span class="cl-count">${doneCount}/${items.length}</span>` : ''}</label>
      <div id="clList">${items.map(checklistItemHtml).join('')}</div>
      <div class="cl-add-row">
        <span class="cl-add-icon">＋</span>
        <input type="text" id="f_cl_new" placeholder="Новая задача...">
      </div>
      <div class="hint">Enter — добавить пункт</div>
    </div>
  `;
}
function checklistItemHtml(item){
  return `<div class="cl-row">
    <button type="button" class="cl-circle${item.done?' done':''}" data-cl-toggle="${escapeAttr(item.id)}" title="${item.done?'Снять отметку':'Отметить как сделано'}"></button>
    <span class="cl-text${item.done?' done':''}">${escapeHtml(item.text)}</span>
    <button type="button" class="cl-del" data-cl-del="${escapeAttr(item.id)}" title="Удалить пункт">×</button>
  </div>`;
}

function pillHtml(kind, id, label, selected, bg, fg, deletable){
  const style = selected ? `background:${bg};color:${fg};` : '';
  const xBtn = deletable ? `<button type="button" class="pill-x" data-del-kind="${kind}" data-del-id="${escapeAttr(id)}" title="Удалить тег">×</button>` : '';
  return `<span class="pill ${selected?'selected':''} ${deletable?'has-x':''}" data-kind="${kind}" data-id="${escapeAttr(id)}" data-bg="${bg}" data-fg="${fg}" style="${style}">${escapeHtml(label)}${xBtn}</span>`;
}
function setupPillGroup(containerId, multi){
  const wrap = document.getElementById(containerId);
  wrap.querySelectorAll('.pill:not(.add-new)').forEach(pill=>{
    pill.addEventListener('click', (e)=>{
      if(e.target.classList.contains('pill-x')) return;
      if(multi){
        pill.classList.toggle('selected');
      } else {
        wrap.querySelectorAll('.pill:not(.add-new)').forEach(p=>{ p.classList.remove('selected'); p.style.background=''; p.style.color=''; });
        pill.classList.add('selected');
      }
      if(pill.classList.contains('selected')){
        pill.style.background = pill.dataset.bg;
        pill.style.color = pill.dataset.fg;
      } else {
        pill.style.background = '';
        pill.style.color = '';
      }
    });
  });
}

function promptAddTag(kind, post){
  const titles = {platform:'Новая площадка', format:'Новый формат', type:'Новый тег'};
  showMiniPrompt(titles[kind] || 'Новый тег', 'Название', (label)=>{
    const platformPalette = [
      {bg:'#DDE7FF',fg:'#2A50B8'},{bg:'#FFE8DC',fg:'#B25A1E'},{bg:'#FFE1E1',fg:'#C42F36'},
      {bg:'#DFF3E5',fg:'#0E7A34'},{bg:'#EFEEF3',fg:'#4A4952'},{bg:'#FFE2D3',fg:'#C24500'}
    ];
    const typeColors = ['#E0894F','#1BA743','#D1596F','#8F6FD1','#337FFF'];
    const id = 'c_' + Date.now().toString(36);
    if(kind==='platform'){
      const c = platformPalette[Math.floor(Math.random()*platformPalette.length)];
      data.platformTags.push({id, label, bg:c.bg, fg:c.fg});
    } else if(kind==='format'){
      data.formatTags.push({id, label, icon:'✦'});
    } else if(kind==='type'){
      data.typeTags.push({id, label, color: typeColors[Math.floor(Math.random()*typeColors.length)]});
    }
    saveData();
    const updated = collectFormIntoPost(post);
    renderModal(updated, editingId===null, kind==='format' ? 'format' : undefined);
    restoreImagePreviewIfAny(updated);
  });
}

function deleteTag(kind, id, post){
  if(kind==='format'){
    data.formatTags = data.formatTags.filter(t=>t.id!==id);
    data.posts.forEach(p=>{ if(p.formats) p.formats = p.formats.filter(x=>x!==id); });
    filters.formats.delete(id);
  } else if(kind==='type'){
    data.typeTags = data.typeTags.filter(t=>t.id!==id);
    data.posts.forEach(p=>{ if(p.types) p.types = p.types.filter(x=>x!==id); });
    filters.types.delete(id);
  }
  saveData();
  renderModal(post, editingId===null, kind==='format' ? 'format' : undefined);
  restoreImagePreviewIfAny(post);
}

function collectFormIntoPost(base){
  const p = Object.assign({}, base);
  p.checklist = (base.checklist||[]).map(i=>({ id:i.id, text:i.text, done:i.done }));
  const get = id => document.getElementById(id);
  if(get('f_title')) p.title = get('f_title').value;
  if(get('f_about')) p.about = get('f_about').value;
  if(get('f_date')) p.date = get('f_date').value;
  if(get('f_resp')) p.responsible = get('f_resp').value;
  if(get('f_link')) p.link = get('f_link').value;
  if(get('f_comment')) p.comment = get('f_comment').value;
  const flagWrap = document.querySelector('.flag-circles');
  if(flagWrap){
    const sel = flagWrap.querySelector('.flag-circ.selected');
    p.flag = sel ? sel.dataset.emoji : '';
  }
  const platWrap = document.getElementById('f_platforms');
  if(platWrap) p.platforms = [...platWrap.querySelectorAll('.pill.selected')].map(el=>el.dataset.id);
  const fmtWrap = document.getElementById('f_format');
  if(fmtWrap) p.formats = [...fmtWrap.querySelectorAll('.pill.selected')].map(el=>el.dataset.id);
  const typeWrap = document.getElementById('f_type');
  if(typeWrap) p.types = [...typeWrap.querySelectorAll('.pill.selected')].map(el=>el.dataset.id);
  const stWrap = document.getElementById('f_status');
  if(stWrap){
    const st = stWrap.querySelector('.pill.selected');
    if(st) p.status = st.dataset.id;
  }
  return p;
}

function renderImagePreview(dataUrl){
  const wrap = document.getElementById('imgPreviewWrap');
  if(!wrap) return;
  wrap.innerHTML = `<img src="${dataUrl}" style="max-width:100%; border-radius:10px; margin-top:8px; display:block;">
    <button type="button" class="danger-link" id="removeImgBtn" style="display:block; margin-top:4px;">Удалить изображение</button>`;
  const clip = document.getElementById('clipBtn');
  if(clip) clip.classList.add('has-img');
  document.getElementById('removeImgBtn').onclick = ()=>{
    pendingImageRemoved = true;
    pendingImageData = undefined;
    const fi = document.getElementById('f_image');
    if(fi) fi.value = '';
    wrap.innerHTML = '';
    const clip2 = document.getElementById('clipBtn');
    if(clip2) clip2.classList.remove('has-img');
  };
}
async function loadPostImage(postId){
  try{
    const res = await window.storage.get('img:'+postId, true);
    if(res && res.value) renderImagePreview(res.value);
  }catch(e){ }
}
function restoreImagePreviewIfAny(post){
  if(pendingImageRemoved) return;
  if(pendingImageData){ renderImagePreview(pendingImageData); }
  else if(post.hasImage){ loadPostImage(post.id); }
}

async function savePostFromForm(base, isNew){
  const post = collectFormIntoPost(base);
  if(!post.title || !post.title.trim()){
    showToastMsg('Добавь заголовок поста');
    return;
  }
  if(!post.status) post.status = DEFAULT_STATUS;
  if(post.responsible && post.responsible.trim() && !data.responsibles.includes(post.responsible.trim())){
    data.responsibles.push(post.responsible.trim());
  }
  post.responsible = post.responsible ? post.responsible.trim() : '';

  if(pendingImageRemoved){
    try{ await window.storage.delete('img:'+post.id, true); }catch(e){}
    post.hasImage = false;
  } else if(pendingImageData){
    try{
      await window.storage.set('img:'+post.id, pendingImageData, true);
      post.hasImage = true;
    }catch(e){ showToastMsg('Не удалось сохранить изображение'); }
  }

  const idx = data.posts.findIndex(p=>p.id===post.id);
  if(idx>=0) data.posts[idx] = post; else data.posts.push(post);

  await saveData();
  closeModal();
  showToastMsg(isNew ? 'Пост добавлен' : 'Сохранено');
}

  openMiniOverlay(`
    <h2 style="font-size:15px;">Копия данных</h2>
    <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;">Нажми в поле ниже, выдели всё (Ctrl+A / Cmd+A) и скопируй (Ctrl+C / Cmd+C). Сохрани текст себе — вставишь его после публикации новой версии.</p>
    <textarea id="exportArea" readonly style="width:100%; min-height:140px; font-family:monospace; font-size:11px; border:1px solid var(--border); border-radius:var(--radius-md); padding:10px; color:var(--ink); background:#fff;">${escapeHtml(json)}</textarea>
    <div class="modal-actions" style="justify-content:flex-end;">
      <button class="btn light small" id="miniCancel">Закрыть</button>
    </div>
  `, 460);
  document.getElementById('miniCancel').onclick = closeMiniOverlay;
  setTimeout(()=>{
    const ta = document.getElementById('exportArea');
    if(ta){ ta.focus(); ta.select(); }
  }, 60);
}

function openImportModal(){
  openMiniOverlay(`
    <h2 style="font-size:15px;">Восстановить из копии</h2>
    <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;">Вставь сюда скопированный ранее текст. Это заменит текущие данные календаря — используй сразу после публикации новой версии, пока календарь пустой.</p>
    <textarea id="importArea" placeholder="Вставь сюда текст копии..." style="width:100%; min-height:140px; font-family:monospace; font-size:11px; border:1px solid var(--border); border-radius:var(--radius-md); padding:10px;"></textarea>
    <div class="modal-actions" style="justify-content:flex-end;">
      <button class="btn light small" id="miniCancel">Отмена</button>
      <button class="btn primary small" id="miniOk">Восстановить</button>
    </div>
  `, 460);
  document.getElementById('miniCancel').onclick = closeMiniOverlay;
  document.getElementById('miniOk').onclick = async ()=>{
    const raw = document.getElementById('importArea').value.trim();
    if(!raw){ showToastMsg('Вставь текст копии'); return; }
    let parsed;
    try{ parsed = JSON.parse(raw); }
    catch(e){ showToastMsg('Не получилось прочитать текст — проверь, что скопировано всё целиком'); return; }
    if(!parsed || !Array.isArray(parsed.posts)){ showToastMsg('Похоже, это не та копия — попробуй ещё раз'); return; }
    data = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
    data.schemaVersion = parsed.schemaVersion || 0;
    ['platformTags','formatTags','typeTags','responsibles','posts','backlog','flagOptions'].forEach(k=>{
      if(!Array.isArray(data[k])) data[k] = DEFAULT_DATA[k];
    });
    migrateIfNeeded();
    await saveData();
    closeMiniOverlay();
    render();
    showToastMsg('Данные восстановлены');
  };
}

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
document.getElementById('miniOverlay').addEventListener('click', (e)=>{ if(e.target.id==='miniOverlay') closeMiniOverlay(); });
document.getElementById('backlogBtn').addEventListener('click', openBacklogModal);

function startApp(){
  (async function(){
    await loadData(false);
    render();
  })();
}
if(window.__kpUnlockedAlready){ startApp(); }
else { window.addEventListener('kp-unlocked', startApp, { once:true }); }
</script>
